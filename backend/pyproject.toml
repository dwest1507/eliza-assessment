[project]
name = "edgar-rag"
version = "0.1.0"
description = "SEC Filings RAG: the edgar_rag core package (standard library only) and edgar_answer, the Answer Call's provider implementations and command line."
requires-python = ">=3.12"
dependencies = [
    "openai>=3.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
eda = [
    "ipykernel>=6",
    "jupytext>=1.16",
    "matplotlib>=3.8",
    "nbconvert>=7",
    "numpy>=2.5.4",
    "pandas>=2.2",
    "tiktoken>=0.14.0",
]

[tool.uv]
default-groups = ["dev", "eda"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_rag", "src/edgar_answer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebooks end cells with a bare expression to display it.
"notebooks/*" = ["B018"]
