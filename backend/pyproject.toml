[project]
name = "edgar-rag"
version = "0.5.0" # x-release-please-version
description = "SEC Filings RAG: the edgar_rag core package (standard library only), edgar_answer (the Answer Call's provider implementations and command line) and edgar_api (the chat API)."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.143.3",
    "openai>=3.31.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pytest>=8",
    "ruff>=0.6",
    "tokenizers>=0.23.3",
    "typesafe-sdk>=0.7.5",
]
eda = [
    "ipykernel>=6",
    "jupytext>=1.16",
    "matplotlib>=3.8",
    "nbconvert>=7",
    "numpy>=2.5.4",
    "pandas>=2.2",
    "tiktoken>=0.14.0",
]

[tool.uv]
default-groups = ["dev", "eda"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_rag", "src/edgar_answer", "src/edgar_api", "src/edgar_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebooks end cells with a bare expression to display it.
"notebooks/*" = ["B018"]
